[project]
name = "slurp-graph"
version = "0.9.6"
description = "Token-budget-aware graph navigation for AI coding agents. Serve exactly the noodles your LLM needs."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Juan Carlos Vallejo Ruiz", email = "juancarlos@prismastats.es"}
]
keywords = ["knowledge-graph", "llm", "token-optimization", "graphify", "ai-tools", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.106.0",
    "click>=8.4.1",
    "networkx>=3.6.1",
    "pathspec>=1.1.1",
    "rich>=15.0.0",
    "tiktoken>=0.13.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
ts = [
    "tree-sitter>=0.22.0",
    "tree-sitter-typescript>=0.23.0",
]
java = [
    "tree-sitter>=0.22.0",
    "tree-sitter-java>=0.23.0",
]
rust = [
    "tree-sitter>=0.22.0",
    "tree-sitter-rust>=0.23.0",
]
csharp = [
    "tree-sitter>=0.22.0",
    "tree-sitter-c-sharp>=0.23.0",
]
ruby = [
    "tree-sitter>=0.22.0",
    "tree-sitter-ruby>=0.23.0",
]
php = [
    "tree-sitter>=0.22.0",
    "tree-sitter-php>=0.23.0",
]
kotlin = [
    "tree-sitter>=0.22.0",
    "tree-sitter-kotlin>=1.1.0",
]
scala = [
    "tree-sitter>=0.22.0",
    "tree-sitter-scala>=0.23.0",
]
swift = [
    "tree-sitter>=0.22.0",
    "tree-sitter-swift>=0.7.0",
]
cpp = [
    "tree-sitter>=0.22.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
]
llm-openai = [
    "openai>=1.0.0",
]
all-languages = [
    "tree-sitter>=0.22.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-scala>=0.23.0",
    "tree-sitter-swift>=0.7.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/CarlosVallejoRuiz/slurp"
Repository = "https://github.com/CarlosVallejoRuiz/slurp"

[project.scripts]
slurp = "slurp.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.hatch.build.targets.wheel]
packages = ["slurp"]

[tool.hatch.build.targets.sdist]
exclude = [
  "assets/",
  "images/",
  "tests/",
  "uv.lock",
  "scratchpad/",
  ".slurp/",
]
